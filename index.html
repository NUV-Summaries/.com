<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NUV Summaries | ملخصات جامعة وادي النيل</title>

<meta name="description" content="NUV Summaries - منصة ملخصات ومحاضرات جامعة وادي النيل">
<meta name="robots" content="index, follow">

<link rel="icon" href="https://i.ibb.co/R42YfR8d/1789148364355.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#050505;
    color:#fff;
    font-family:Cairo,Manrope,sans-serif;
    min-height:100vh;
}

a{
    color:inherit;
    text-decoration:none;
}

.header{
    width:100%;
    border-bottom:1px solid rgba(212,175,55,.15);
    background:#080808;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    padding:20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo img{
    width:48px;
    height:48px;
    object-fit:contain;
}

.logo-text{
    font-size:21px;
    font-weight:800;
}

.logo-text span{
    color:#d4af37;
}

.hero{
    max-width:1200px;
    margin:auto;
    padding:70px 20px 35px;
    text-align:center;
}

.hero h1{
    font-size:clamp(32px,6vw,58px);
    font-weight:800;
    line-height:1.2;
}

.hero h1 span{
    color:#d4af37;
}

.hero p{
    color:#aaa;
    margin-top:15px;
    font-size:16px;
}

.search-box{
    max-width:650px;
    margin:35px auto 0;
    position:relative;
}

.search-box input{
    width:100%;
    height:58px;
    border-radius:15px;
    border:1px solid rgba(212,175,55,.25);
    background:#0d0d0d;
    color:#fff;
    padding:0 20px;
    outline:none;
    font-family:inherit;
    font-size:15px;
    transition:.25s;
}

.search-box input:focus{
    border-color:#d4af37;
    box-shadow:0 0 0 3px rgba(212,175,55,.08);
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin:30px 0 20px;
}

.section-title h2{
    font-size:24px;
}

.section-title span{
    color:#888;
    font-size:14px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:18px;
}

.card{
    background:linear-gradient(145deg,#101010,#080808);
    border:1px solid rgba(212,175,55,.16);
    border-radius:18px;
    padding:24px;
    cursor:pointer;
    transition:.25s;
}

.card:hover{
    transform:translateY(-4px);
    border-color:rgba(212,175,55,.55);
    box-shadow:0 12px 35px rgba(0,0,0,.4);
}

.card-icon{
    width:50px;
    height:50px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(212,175,55,.08);
    border:1px solid rgba(212,175,55,.2);
    margin-bottom:18px;
}

.card-icon svg{
    width:25px;
    height:25px;
    fill:none;
    stroke:#d4af37;
    stroke-width:1.8;
}

.card h3{
    font-size:17px;
    line-height:1.6;
}

.card p{
    color:#888;
    font-size:13px;
    margin-top:8px;
}

.back{
    display:none;
    align-items:center;
    gap:8px;
    margin:10px 0 20px;
    color:#d4af37;
    cursor:pointer;
    font-size:14px;
}

.weeks{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:16px;
}

.week-card{
    background:#0c0c0c;
    border:1px solid rgba(212,175,55,.15);
    border-radius:16px;
    padding:22px;
    cursor:pointer;
    transition:.25s;
}

.week-card:hover{
    border-color:#d4af37;
    transform:translateY(-3px);
}

.week-card h3{
    font-size:17px;
}

.week-card p{
    color:#777;
    font-size:13px;
    margin-top:7px;
}

.summary-view{
    display:none;
}

.summary-info{
    background:#0c0c0c;
    border:1px solid rgba(212,175,55,.15);
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
}

.summary-info h2{
    color:#d4af37;
    margin-bottom:12px;
}

.summary-meta{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    color:#aaa;
    font-size:13px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:15px;
}

.image-card{
    background:#0b0b0b;
    border:1px solid rgba(212,175,55,.14);
    border-radius:15px;
    overflow:hidden;
    cursor:pointer;
}

.image-card img{
    width:100%;
    display:block;
    aspect-ratio:3/4;
    object-fit:cover;
    transition:.3s;
}

.image-card:hover img{
    transform:scale(1.025);
}

.loading,
.empty,
.error{
    text-align:center;
    padding:60px 20px;
    color:#888;
}

.error{
    color:#d4af37;
}

.hidden{
    display:none!important;
}

.lightbox{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
    z-index:9999;
    display:none;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.lightbox.active{
    display:flex;
}

.lightbox img{
    max-width:95vw;
    max-height:90vh;
    object-fit:contain;
}

.lightbox-close,
.lightbox-prev,
.lightbox-next{
    position:absolute;
    width:45px;
    height:45px;
    border-radius:50%;
    border:1px solid rgba(212,175,55,.35);
    background:#101010;
    color:#d4af37;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:22px;
}

.lightbox-close{
    top:20px;
    right:20px;
}

.lightbox-prev{
    right:20px;
    top:50%;
    transform:translateY(-50%);
}

.lightbox-next{
    left:20px;
    top:50%;
    transform:translateY(-50%);
}

footer{
    margin-top:80px;
    padding:30px 20px;
    text-align:center;
    color:#666;
    border-top:1px solid rgba(212,175,55,.1);
    font-size:13px;
}

footer span{
    color:#d4af37;
}

@media(max-width:600px){
    .hero{
        padding-top:45px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .weeks{
        grid-template-columns:1fr;
    }

    .gallery{
        grid-template-columns:repeat(2,1fr);
    }

    .header-inner{
        padding:15px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <div class="logo">
            <img src="https://i.ibb.co/R42YfR8d/1789148364355.png" alt="NUV">
            <div class="logo-text">NUV <span>Summaries</span></div>
        </div>
    </div>
</header>

<section class="hero">
    <h1>NUV <span>Summaries</span></h1>
    <p>ملخصات ومحاضرات جامعة وادي النيل</p>

    <div class="search-box">
        <input id="searchInput" type="search" placeholder="ابحث عن المادة...">
    </div>
</section>

<main class="container">

    <div id="backButton" class="back">
        <span>←</span>
        <span>العودة للمواد</span>
    </div>

    <div id="subjectsView">
        <div class="section-title">
            <h2>المواد الدراسية</h2>
            <span id="subjectCount"></span>
        </div>

        <div id="subjectsGrid" class="grid"></div>

        <div id="subjectsLoading" class="loading">
            جاري تحميل المواد...
        </div>

        <div id="subjectsEmpty" class="empty hidden">
            لا توجد مواد متاحة حاليًا.
        </div>
    </div>

    <div id="weeksView" class="hidden">

        <div class="section-title">
            <h2 id="subjectTitle"></h2>
            <span id="weekCount"></span>
        </div>

        <div id="weeksGrid" class="weeks"></div>

        <div id="weeksEmpty" class="empty hidden">
            لا توجد أسابيع متاحة لهذه المادة.
        </div>

    </div>

    <div id="summaryView" class="summary-view">

        <div class="section-title">
            <h2 id="weekTitle"></h2>
        </div>

        <div id="summaryInfo" class="summary-info"></div>

        <div id="gallery" class="gallery"></div>

        <div id="galleryEmpty" class="empty hidden">
            لا توجد ملخصات في هذا الأسبوع.
        </div>

    </div>

</main>

<footer>
    Made by <span>Dr. Omar Mustafa</span>
</footer>

<div id="lightbox" class="lightbox">

    <button id="closeLightbox" class="lightbox-close">×</button>
    <button id="prevImage" class="lightbox-prev">‹</button>
    <button id="nextImage" class="lightbox-next">›</button>

    <img id="lightboxImage" src="" alt="Summary">

</div>

<script>
"use strict";

const state = {
    subjects: [],
    currentSubject: null,
    currentWeek: null,
    images: [],
    currentImage: 0
};

const elements = {
    search: document.getElementById("searchInput"),
    subjectsView: document.getElementById("subjectsView"),
    weeksView: document.getElementById("weeksView"),
    summaryView: document.getElementById("summaryView"),
    subjectsGrid: document.getElementById("subjectsGrid"),
    weeksGrid: document.getElementById("weeksGrid"),
    gallery: document.getElementById("gallery"),
    subjectCount: document.getElementById("subjectCount"),
    weekCount: document.getElementById("weekCount"),
    subjectTitle: document.getElementById("subjectTitle"),
    weekTitle: document.getElementById("weekTitle"),
    summaryInfo: document.getElementById("summaryInfo"),
    backButton: document.getElementById("backButton"),
    subjectsLoading: document.getElementById("subjectsLoading"),
    subjectsEmpty: document.getElementById("subjectsEmpty"),
    weeksEmpty: document.getElementById("weeksEmpty"),
    galleryEmpty: document.getElementById("galleryEmpty"),
    lightbox: document.getElementById("lightbox"),
    lightboxImage: document.getElementById("lightboxImage"),
    closeLightbox: document.getElementById("closeLightbox"),
    prevImage: document.getElementById("prevImage"),
    nextImage: document.getElementById("nextImage")
};

document.addEventListener("DOMContentLoaded", init);

async function init(){
    try{
        const response = await fetch("summaries/subjects.json", {
            cache:"no-cache"
        });

        if(!response.ok){
            throw new Error("subjects.json not found");
        }

        const data = await response.json();

        if(!Array.isArray(data)){
            throw new Error("Invalid subjects.json");
        }

        state.subjects = data;

        elements.subjectsLoading.classList.add("hidden");

        renderSubjects();

    }catch(error){

        console.error(error);

        elements.subjectsLoading.classList.add("hidden");
        elements.subjectsEmpty.classList.remove("hidden");

        elements.subjectsEmpty.textContent =
            "تعذر تحميل المواد. تأكد من وجود summaries/subjects.json";
    }

    setupEvents();
}

function setupEvents(){

    elements.search.addEventListener("input", function(){
        if(!state.currentSubject){
            renderSubjects();
        }
    });

    elements.backButton.addEventListener("click", function(){

        if(state.summaryView.style.display === "block"){

            openSubject(state.currentSubject);

        }else if(!elements.weeksView.classList.contains("hidden")){

            showSubjects();

        }

    });

    elements.closeLightbox.addEventListener("click", closeLightbox);

    elements.prevImage.addEventListener("click", previousImage);

    elements.nextImage.addEventListener("click", nextImage);

    document.addEventListener("keydown", function(event){

        if(event.key === "Escape"){
            closeLightbox();
        }

        if(event.key === "ArrowLeft"){
            nextImage();
        }

        if(event.key === "ArrowRight"){
            previousImage();
        }

    });

}

function renderSubjects(){

    const search = elements.search.value.trim().toLowerCase();

    const filtered = state.subjects.filter(subject =>
        String(subject.name || "").toLowerCase().includes(search)
    );

    elements.subjectCount.textContent =
        filtered.length + " مادة";

    elements.subjectsGrid.innerHTML = "";

    if(!filtered.length){

        elements.subjectsEmpty.classList.remove("hidden");
        return;

    }

    elements.subjectsEmpty.classList.add("hidden");

    filtered.forEach(subject => {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <div class="card-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/>
                    <path d="M4 5.5v16"/>
                </svg>
            </div>
            <h3>${escapeHtml(subject.name)}</h3>
            <p>${Array.isArray(subject.weeks) ? subject.weeks.length : 0} أسابيع</p>
        `;

        card.addEventListener("click", () => openSubject(subject));

        elements.subjectsGrid.appendChild(card);

    });

}

function openSubject(subject){

    state.currentSubject = subject;
    state.currentWeek = null;

    elements.subjectsView.classList.add("hidden");
    elements.summaryView.style.display = "none";
    elements.weeksView.classList.remove("hidden");
    elements.backButton.style.display = "flex";

    elements.subjectTitle.textContent = subject.name;

    const weeks = Array.isArray(subject.weeks)
        ? subject.weeks
        : [];

    elements.weekCount.textContent =
        weeks.length + " أسابيع";

    elements.weeksGrid.innerHTML = "";

    if(!weeks.length){

        elements.weeksEmpty.classList.remove("hidden");
        return;

    }

    elements.weeksEmpty.classList.add("hidden");

    weeks.forEach(week => {

        const card = document.createElement("div");

        card.className = "week-card";

        card.innerHTML = `
            <h3>${escapeHtml(week.name)}</h3>
            <p>عرض ملخصات الأسبوع</p>
        `;

        card.addEventListener("click", () => openWeek(week));

        elements.weeksGrid.appendChild(card);

    });

}

async function openWeek(week){

    state.currentWeek = week;

    elements.weeksView.classList.add("hidden");
    elements.summaryView.style.display = "block";

    elements.weekTitle.textContent = week.name;

    elements.gallery.innerHTML = "";

    elements.summaryInfo.innerHTML = `
        <h2>${escapeHtml(week.name)}</h2>
        <div class="summary-meta">
            <span>جاري تحميل البيانات...</span>
        </div>
    `;

    try{

        const infoUrl =
            "summaries/" +
            encodePath(week.path) +
            "/info.json";

        const response = await fetch(infoUrl, {
            cache:"no-cache"
        });

        if(response.ok){

            const info = await response.json();

            elements.summaryInfo.innerHTML = `
                <h2>${escapeHtml(week.name)}</h2>
                <div class="summary-meta">
                    <span>الدكتور: ${escapeHtml(info.drname || "غير محدد")}</span>
                    <span>التقييم: ${"★".repeat(Number(info.stars || 0))}</span>
                    <span>${escapeHtml(info.date || "")}</span>
                    <span>${escapeHtml(info.time || "")}</span>
                </div>
            `;

        }

    }catch(error){

        console.error(error);

    }

    renderImages(week);
}

function renderImages(week){

    elements.gallery.innerHTML = "";

    const imageFiles = [];

    for(let i = 1; i <= 100; i++){

        const number = String(i).padStart(2, "0");

        imageFiles.push(
            "summaries/" +
            encodePath(week.path) +
            "/" +
            number +
            ".jpg"
        );

    }

    state.images = imageFiles;

    let loaded = 0;

    imageFiles.forEach((url, index) => {

        const img = new Image();

        img.onload = function(){

            loaded++;

            const card = document.createElement("div");

            card.className = "image-card";

            card.innerHTML = `
                <img src="${url}" alt="${escapeHtml(week.name)} - ${String(index + 1).padStart(2,"0")}">
            `;

            card.addEventListener("click", function(){
                openLightbox(index);
            });

            elements.gallery.appendChild(card);

        };

        img.onerror = function(){

            loaded++;

            if(
                loaded === imageFiles.length &&
                elements.gallery.children.length === 0
            ){
                elements.galleryEmpty.classList.remove("hidden");
            }

        };

        img.src = url;

    });

}

function openLightbox(index){

    if(!state.images.length) return;

    state.currentImage = index;

    elements.lightboxImage.src =
        state.images[state.currentImage];

    elements.lightbox.classList.add("active");

}

function closeLightbox(){

    elements.lightbox.classList.remove("active");

}

function nextImage(){

    if(!state.images.length) return;

    state.currentImage =
        (state.currentImage + 1) % state.images.length;

    elements.lightboxImage.src =
        state.images[state.currentImage];

}

function previousImage(){

    if(!state.images.length) return;

    state.currentImage =
        (state.currentImage - 1 + state.images.length) %
        state.images.length;

    elements.lightboxImage.src =
        state.images[state.currentImage];

}

function showSubjects(){

    state.currentSubject = null;
    state.currentWeek = null;

    elements.summaryView.style.display = "none";
    elements.weeksView.classList.add("hidden");
    elements.subjectsView.classList.remove("hidden");
    elements.backButton.style.display = "none";

    renderSubjects();

}

function encodePath(path){

    return path
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");

}

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
</script>

</body>
  </html>
