<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NUV Summaries | ملخصات جامعة وادي النيل</title>

<meta name="description" content="NUV Summaries - ملخصات مواد كلية العلاج الطبيعي بجامعة وادي النيل">
<meta name="robots" content="index,follow">

<link rel="icon" href="https://i.ibb.co/R42YfR8d/1789148364355.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
background:#050505;
color:#fff;
font-family:Cairo,Manrope,sans-serif;
min-height:100vh;
}

button,
input{
font-family:inherit;
}

button{
border:0;
outline:0;
}

.header{
height:78px;
border-bottom:1px solid rgba(212,175,55,.14);
background:#070707;
}

.header-inner{
height:100%;
max-width:1180px;
margin:auto;
padding:0 20px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
display:flex;
align-items:center;
gap:12px;
}

.logo img{
width:43px;
height:43px;
object-fit:contain;
}

.logo-title{
font-family:Manrope,sans-serif;
font-weight:800;
font-size:20px;
letter-spacing:-.4px;
}

.logo-title span{
color:#d4af37;
}

.hero{
max-width:1180px;
margin:auto;
padding:70px 20px 35px;
text-align:center;
}

.hero h1{
font-family:Manrope,Cairo,sans-serif;
font-size:clamp(36px,6vw,64px);
font-weight:800;
letter-spacing:-2px;
}

.hero h1 span{
color:#d4af37;
}

.hero p{
margin-top:13px;
color:#999;
font-size:15px;
}

.search{
max-width:650px;
margin:32px auto 0;
position:relative;
}

.search input{
width:100%;
height:56px;
background:#0d0d0d;
border:1px solid rgba(212,175,55,.18);
border-radius:15px;
color:#fff;
padding:0 20px;
font-size:14px;
outline:none;
transition:.25s;
}

.search input:focus{
border-color:#d4af37;
box-shadow:0 0 0 3px rgba(212,175,55,.07);
}

.container{
max-width:1180px;
margin:auto;
padding:10px 20px 50px;
}

.topbar{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
margin:20px 0;
}

.title-area h2{
font-size:23px;
font-weight:800;
}

.title-area p{
font-size:13px;
color:#777;
margin-top:4px;
}

.back-btn{
display:none;
align-items:center;
gap:8px;
height:42px;
padding:0 16px;
border-radius:12px;
background:#101010;
border:1px solid rgba(212,175,55,.22);
color:#d4af37;
cursor:pointer;
transition:.2s;
}

.back-btn:hover{
border-color:#d4af37;
background:#141414;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:17px;
}

.subject-card{
position:relative;
overflow:hidden;
padding:24px;
min-height:165px;
background:linear-gradient(145deg,#111,#080808);
border:1px solid rgba(212,175,55,.13);
border-radius:18px;
cursor:pointer;
transition:.25s;
}

.subject-card:before{
content:"";
position:absolute;
width:100px;
height:100px;
background:rgba(212,175,55,.05);
filter:blur(35px);
top:-40px;
right:-30px;
}

.subject-card:hover{
transform:translateY(-4px);
border-color:rgba(212,175,55,.5);
}

.icon-box{
width:48px;
height:48px;
border-radius:13px;
display:flex;
align-items:center;
justify-content:center;
background:rgba(212,175,55,.07);
border:1px solid rgba(212,175,55,.16);
margin-bottom:17px;
}

.icon-box svg{
width:24px;
height:24px;
stroke:#d4af37;
fill:none;
stroke-width:1.7;
}

.subject-card h3{
font-size:16px;
line-height:1.6;
position:relative;
}

.subject-card .count{
color:#777;
font-size:12px;
margin-top:6px;
position:relative;
}

.weeks-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
}

.week-card{
padding:23px;
background:#0c0c0c;
border:1px solid rgba(212,175,55,.13);
border-radius:16px;
cursor:pointer;
transition:.25s;
}

.week-card:hover{
transform:translateY(-3px);
border-color:rgba(212,175,55,.5);
}

.week-number{
font-family:Manrope,sans-serif;
font-size:12px;
color:#d4af37;
margin-bottom:10px;
}

.week-card h3{
font-size:17px;
}

.week-card p{
font-size:12px;
color:#777;
margin-top:6px;
}

.summary-head{
background:linear-gradient(145deg,#111,#080808);
border:1px solid rgba(212,175,55,.15);
border-radius:18px;
padding:23px;
margin-bottom:18px;
}

.summary-head h2{
font-size:21px;
margin-bottom:16px;
}

.summary-meta{
display:flex;
align-items:center;
flex-wrap:wrap;
gap:18px;
color:#999;
font-size:13px;
}

.doctor{
color:#fff;
}

.doctor strong{
color:#d4af37;
font-weight:700;
}

.date{
color:#999;
}

.stars{
display:flex;
align-items:center;
gap:3px;
direction:ltr;
}

.star{
width:19px;
height:19px;
}

.star svg{
width:100%;
height:100%;
fill:#262626;
stroke:#d4af37;
stroke-width:1.2;
}

.star.active svg{
fill:#d4af37;
}

.gallery{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
}

.image-card{
background:#0b0b0b;
border:1px solid rgba(212,175,55,.12);
border-radius:15px;
overflow:hidden;
cursor:pointer;
}

.image-card img{
display:block;
width:100%;
aspect-ratio:3/4;
object-fit:cover;
transition:.3s;
}

.image-card:hover img{
transform:scale(1.025);
}

.loading,
.empty,
.error{
padding:65px 20px;
text-align:center;
color:#777;
}

.error{
color:#d4af37;
}

.hidden{
display:none!important;
}

.lightbox{
position:fixed;
inset:0;
z-index:1000;
display:none;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.96);
padding:20px;
}

.lightbox.active{
display:flex;
}

.lightbox img{
max-width:92vw;
max-height:88vh;
object-fit:contain;
}

.lb-button{
position:absolute;
width:46px;
height:46px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#111;
border:1px solid rgba(212,175,55,.3);
color:#d4af37;
font-size:25px;
cursor:pointer;
}

.lb-close{
top:20px;
right:20px;
}

.lb-next{
left:20px;
top:50%;
transform:translateY(-50%);
}

.lb-prev{
right:20px;
top:50%;
transform:translateY(-50%);
}

footer{
border-top:1px solid rgba(212,175,55,.1);
text-align:center;
padding:28px 20px;
color:#666;
font-size:12px;
}

footer span{
color:#d4af37;
}

@media(max-width:950px){
.grid{
grid-template-columns:repeat(2,1fr);
}

.weeks-grid{
grid-template-columns:repeat(2,1fr);
}

.gallery{
grid-template-columns:repeat(3,1fr);
}
}

@media(max-width:600px){
.header{
height:70px;
}

.hero{
padding-top:45px;
}

.hero h1{
letter-spacing:-1px;
}

.grid,
.weeks-grid{
grid-template-columns:1fr;
}

.gallery{
grid-template-columns:repeat(2,1fr);
}

.topbar{
align-items:flex-start;
}

.summary-meta{
gap:11px;
}
}
</style>
</head>

<body>

<header class="header">
<div class="header-inner">
<div class="logo">
<img src="https://i.ibb.co/R42YfR8d/1789148364355.png" alt="NUV">
<div class="logo-title">NUV <span>Summaries</span></div>
</div>
</div>
</header>

<section class="hero">
<h1>NUV <span>Summaries</span></h1>
<p>ملخصات ومراجعات مواد كلية العلاج الطبيعي</p>

<div class="search">
<input id="searchInput" type="search" placeholder="ابحث عن المادة...">
</div>
</section>

<main class="container">

<div class="topbar">

<div class="title-area">
<h2 id="pageTitle">المواد الدراسية</h2>
<p id="pageSubtitle">اختر المادة لعرض الأسابيع والملخصات</p>
</div>

<button id="backButton" class="back-btn">
<span>←</span>
<span>عودة</span>
</button>

</div>

<section id="subjectsSection">

<div id="subjectsGrid" class="grid"></div>

<div id="subjectsLoading" class="loading">
جاري تحميل المواد...
</div>

<div id="subjectsEmpty" class="empty hidden">
لا توجد مواد متاحة.
</div>

</section>

<section id="weeksSection" class="hidden">

<div id="weeksGrid" class="weeks-grid"></div>

<div id="weeksEmpty" class="empty hidden">
لا توجد أسابيع متاحة لهذه المادة.
</div>

</section>

<section id="summarySection" class="hidden">

<div id="summaryHead" class="summary-head"></div>

<div id="gallery" class="gallery"></div>

<div id="galleryEmpty" class="empty hidden">
لا توجد صور للملخص.
</div>

</section>

</main>

<footer>
Made by <span>Dr. Omar Mustafa</span>
</footer>

<div id="lightbox" class="lightbox">

<button id="lbClose" class="lb-button lb-close">×</button>
<button id="lbPrev" class="lb-button lb-prev">›</button>
<button id="lbNext" class="lb-button lb-next">‹</button>

<img id="lbImage" src="" alt="Summary">

</div>

<script>
"use strict";

const state={
subjects:[],
currentSubject:null,
currentWeek:null,
images:[],
imageIndex:0,
level:"subjects"
};

const $=id=>document.getElementById(id);

const subjectsGrid=$("subjectsGrid");
const weeksGrid=$("weeksGrid");
const gallery=$("gallery");
const subjectsSection=$("subjectsSection");
const weeksSection=$("weeksSection");
const summarySection=$("summarySection");
const backButton=$("backButton");
const pageTitle=$("pageTitle");
const pageSubtitle=$("pageSubtitle");
const searchInput=$("searchInput");
const lightbox=$("lightbox");
const lbImage=$("lbImage");

document.addEventListener("DOMContentLoaded",init);

async function init(){

try{

const response=await fetch("summaries/subjects.json",{cache:"no-cache"});

if(!response.ok){
throw new Error("subjects.json not found");
}

const data=await response.json();

if(!Array.isArray(data)){
throw new Error("Invalid subjects.json");
}

state.subjects=data;

$("subjectsLoading").classList.add("hidden");

renderSubjects();

}catch(error){

console.error(error);

$("subjectsLoading").classList.add("hidden");
$("subjectsEmpty").classList.remove("hidden");
$("subjectsEmpty").textContent="تعذر تحميل المواد. تأكد من وجود summaries/subjects.json";

}

setupEvents();

}

function setupEvents(){

searchInput.addEventListener("input",()=>{

if(state.level==="subjects"){
renderSubjects();
}

});

backButton.addEventListener("click",goBack);

$("lbClose").addEventListener("click",closeLightbox);
$("lbNext").addEventListener("click",nextImage);
$("lbPrev").addEventListener("click",prevImage);

document.addEventListener("keydown",event=>{

if(event.key==="Escape"){
closeLightbox();
}

if(event.key==="ArrowLeft"){
nextImage();
}

if(event.key==="ArrowRight"){
prevImage();
}

});

}

function renderSubjects(){

const query=searchInput.value.trim().toLowerCase();

const list=state.subjects.filter(item=>
String(item.name||"").toLowerCase().includes(query)
);

subjectsGrid.innerHTML="";

if(!list.length){

$("subjectsEmpty").classList.remove("hidden");
return;

}

$("subjectsEmpty").classList.add("hidden");

list.forEach(subject=>{

const card=document.createElement("article");

card.className="subject-card";

const weeks=Array.isArray(subject.weeks)?subject.weeks.length:0;

card.innerHTML=`
<div class="icon-box">
<svg viewBox="0 0 24 24">
<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/>
<path d="M4 5.5v16"/>
</svg>
</div>
<h3>${escapeHtml(subject.name)}</h3>
<div class="count">${weeks} ${weeks===1?"أسبوع":"أسابيع"}</div>
`;

card.addEventListener("click",()=>openSubject(subject));

subjectsGrid.appendChild(card);

});

}

function openSubject(subject){

state.currentSubject=subject;
state.currentWeek=null;
state.level="weeks";

subjectsSection.classList.add("hidden");
summarySection.classList.add("hidden");
weeksSection.classList.remove("hidden");

backButton.style.display="flex";

pageTitle.textContent=subject.name;
pageSubtitle.textContent="اختر الأسبوع لعرض الملخصات";

searchInput.value="";

weeksGrid.innerHTML="";

const weeks=Array.isArray(subject.weeks)?subject.weeks:[];

if(!weeks.length){

$("weeksEmpty").classList.remove("hidden");
return;

}

$("weeksEmpty").classList.add("hidden");

weeks.forEach((week,index)=>{

const card=document.createElement("article");

card.className="week-card";

card.innerHTML=`
<div class="week-number">WEEK ${index+1}</div>
<h3>${escapeHtml(week.name)}</h3>
<p>عرض ملخصات هذا الأسبوع</p>
`;

card.addEventListener("click",()=>openWeek(week));

weeksGrid.appendChild(card);

});

}

async function openWeek(week){

state.currentWeek=week;
state.level="summary";

weeksSection.classList.add("hidden");
summarySection.classList.remove("hidden");

pageTitle.textContent=week.name;
pageSubtitle.textContent=state.currentSubject.name;

backButton.style.display="flex";

gallery.innerHTML="";
$("galleryEmpty").classList.add("hidden");

await loadInfo(week);

loadImages(week);

}

async function loadInfo(week){

const path="summaries/"+encodePath(week.path)+"/info.json";

try{

const response=await fetch(path,{cache:"no-cache"});

if(!response.ok){
throw new Error("info.json not found");
}

const info=await response.json();

const stars=Math.max(0,Math.min(5,Number(info.stars)||0));

let starsHtml="";

for(let i=1;i<=5;i++){

starsHtml+=`
<span class="star ${i<=stars?"active":""}">
<svg viewBox="0 0 24 24">
<path d="M12 3.5l2.63 5.33 5.87.85-4.25 4.14 1 5.85L12 16.91l-5.25 2.76 1-5.85L2.5 9.68l5.87-.85z"/>
</svg>
</span>
`;

}

$("summaryHead").innerHTML=`
<h2>${escapeHtml(week.name)}</h2>

<div class="summary-meta">

<div class="doctor">
بواسطة <strong>${escapeHtml(info.drname||"غير محدد")}</strong>
</div>

<div class="stars">
${starsHtml}
</div>

<div class="date">
${escapeHtml(info.date||"")}
${info.time?" — "+escapeHtml(info.time):""}
</div>

</div>
`;

}catch(error){

console.error(error);

$("summaryHead").innerHTML=`
<h2>${escapeHtml(week.name)}</h2>
<div class="summary-meta">
<div class="doctor">
بواسطة <strong>غير محدد</strong>
</div>
</div>
`;

}

}

function loadImages(week){

gallery.innerHTML="";
state.images=[];

const base="summaries/"+encodePath(week.path)+"/";

let found=0;
let checked=0;
const total=100;

for(let i=1;i<=total;i++){

const number=String(i).padStart(2,"0");
const url=base+number+".jpg";

const image=new Image();

image.onload=()=>{

found++;

state.images.push(url);

const index=state.images.length-1;

const card=document.createElement("div");

card.className="image-card";

card.innerHTML=`
<img src="${url}" alt="${escapeHtml(week.name)} ${number}">
`;

card.addEventListener("click",()=>openLightbox(index));

gallery.appendChild(card);

checked++;

finishImages();

};

image.onerror=()=>{

checked++;
finishImages();

};

image.src=url;

}

function finishImages(){

if(checked===total&&found===0){

$("galleryEmpty").classList.remove("hidden");

}

}

function openLightbox(index){

if(!state.images.length)return;

state.imageIndex=index;

lbImage.src=state.images[index];

lightbox.classList.add("active");

}

function closeLightbox(){

lightbox.classList.remove("active");

}

function nextImage(){

if(!state.images.length)return;

state.imageIndex=
(state.imageIndex+1)%state.images.length;

lbImage.src=state.images[state.imageIndex];

}

function prevImage(){

if(!state.images.length)return;

state.imageIndex=
(state.imageIndex-1+state.images.length)%
state.images.length;

lbImage.src=state.images[state.imageIndex];

}

function goBack(){

if(state.level==="summary"){

openSubject(state.currentSubject);
return;

}

if(state.level==="weeks"){

state.level="subjects";
state.currentSubject=null;

weeksSection.classList.add("hidden");
summarySection.classList.add("hidden");
subjectsSection.classList.remove("hidden");

backButton.style.display="none";

pageTitle.textContent="المواد الدراسية";
pageSubtitle.textContent="اختر المادة لعرض الأسابيع والملخصات";

searchInput.value="";

renderSubjects();

}

}

function encodePath(path){

return String(path)
.split("/")
.map(part=>encodeURIComponent(part))
.join("/");

}

function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}
</script>

</body>
    </html>
